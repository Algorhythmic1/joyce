<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5ea"/>
      <stop offset="1" stop-color="#ebe1cc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#581c87" stop-opacity=".75"/>
    </linearGradient>
    <g id="frames" fill="none" stroke-width="30" stroke-linecap="round">
      <circle cx="362" cy="530" r="128"/>
      <circle cx="662" cy="530" r="128"/>
      <path d="M480 500 Q512 470 544 500"/>
      <path d="M236 500 L170 460"/>
      <path d="M788 500 L854 460"/>
    </g>
  </defs>

  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)"/></g>
  <g clip-path="url(#sq)">
    <!-- Shadow of the spectacles resting on the page. -->
    <use href="#frames" stroke="#3b2f1f" stroke-opacity=".16" filter="url(#soft)" transform="translate(0 22)"/>
    <!-- The left lens darker: Joyce's failing eye. -->
    <circle cx="362" cy="530" r="114" fill="url(#tint)"/>
    <circle cx="662" cy="530" r="114" fill="#ffffff" fill-opacity=".35"/>
    <use href="#frames" stroke="#25222c"/>
    <path d="M300 468 Q330 440 372 440" stroke="#fff" stroke-opacity=".45" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M600 468 Q630 440 672 440" stroke="#fff" stroke-opacity=".9" stroke-width="16" fill="none" stroke-linecap="round"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
</svg>
