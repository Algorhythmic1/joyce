[package]
name = "joyce"
version = "0.1.0"
edition = "2021"

[lib]
name = "joyce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
trash = "5"
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json"] }
# The OS's own secret store on each platform: macOS Keychain, Windows Credential
# Manager, Linux Secret Service (GNOME Keyring, KWallet).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
open = "5"
# Sync: end-to-end encryption, the server connection, and background work.
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
hex = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
gethostname = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
